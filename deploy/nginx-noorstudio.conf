####################################################################
# NoorStudio — nginx server block (HTTP). Certbot adds the 443 block
# and the 80->443 redirect when you run `certbot --nginx`.
# Replace YOUR_DOMAIN before enabling.
####################################################################
server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN www.YOUR_DOMAIN;

    root /var/www/noorstudio;
    index index.php;

    client_max_body_size 64M;

    # Symlinked theme directory must be followable.
    disable_symlinks off;

    # Pretty permalinks -> WordPress front controller.
    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    # PHP via PHP-FPM (8.3 on Ubuntu 24.04 — adjust the socket if your version differs).
    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param HTTP_PROXY "";
    }

    # Long-cache static assets (helps LCP / Core Web Vitals targets).
    location ~* \.(?:css|js|woff2?|ttf|otf|svg|png|jpe?g|gif|webp|avif|ico)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
        try_files $uri =404;
    }

    # Let WordPress serve its virtual robots.txt (carries the strategy crawl rules).
    location = /robots.txt { try_files $uri /index.php?$args; access_log off; log_not_found off; }
    location = /favicon.ico { access_log off; log_not_found off; }

    # Hardening: block dotfiles (except ACME), and PHP execution in uploads.
    location ~ /\.(?!well-known) { deny all; }
    location ~* /wp-content/uploads/.*\.php$ { deny all; }
    location = /wp-config.php { deny all; }
    location ~* /(?:xmlrpc\.php)$ { deny all; }
}
